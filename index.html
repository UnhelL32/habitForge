<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- React & ReactDOM -->

  <style>

    }

</head>
<body class="bg-[#0E1117]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- CLEAR ALL SAVED LOCAL STORAGE DATA ON LOAD ---
    localStorage.removeItem('questforge_user');
    localStorage.removeItem('questforge_habits');

    // --- LUCIDE ICON HELPER ---
    const IconWrapper = ({ name, className = "w-4 h-4", ...props }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          if (window.lucide) {
            window.lucide.createIcons({
              attrs: { class: className },
              nameAttr: 'data-lucide'
            });
          }
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" {...props} />;
    };

    const createIcon = (name) => (props) => <IconWrapper name={name} {...props} />;

    const Trophy = createIcon('trophy');
    const Shield = createIcon('shield');
    const Sword = createIcon('sword');
    const Flame = createIcon('flame');
    const Sparkles = createIcon('sparkles');
    const BookOpen = createIcon('book-open');
    const Droplets = createIcon('droplets');
    const Dumbbell = createIcon('dumbbell');
    const Code = createIcon('code');
    const Globe = createIcon('globe');
    const Moon = createIcon('moon');
    const Calendar = createIcon('calendar');
    const BarChart2 = createIcon('bar-chart-2');
    const User = createIcon('user');
    const Package = createIcon('package');
    const Bell = createIcon('bell');
    const Compass = createIcon('compass');
    const Plus = createIcon('plus');
    const Check = createIcon('check');
    const X = createIcon('x');
    const Edit3 = createIcon('edit-3');
    const Trash2 = createIcon('trash-2');
    const Zap = createIcon('zap');
    const Lock = createIcon('lock');
    const Volume2 = createIcon('volume-2');
    const VolumeX = createIcon('volume-x');
    const AlertTriangle = createIcon('alert-triangle');
    const CheckCircle2 = createIcon('check-circle-2');
    const Clock = createIcon('clock');
    const PieChart = createIcon('pie-chart');
    const RotateCcw = createIcon('rotate-ccw');

    // --- SOUND SYNTHESIZER (WEB AUDIO API) ---
    const playSound = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'complete') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.08);
            osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
          });
        } else if (type === 'levelup') {
          const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.09);
            osc.stop(ctx.currentTime + idx * 0.09 + 0.35);
          });
        } else if (type === 'loot') {
          for (let i = 0; i < 6; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600 + i * 250, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.2);
          }
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch (e) {}
    };

    // --- DATA CATALOG & CONSTANTS ---
    const HABIT_CATEGORIES = [
      { id: 'Fitness', name: 'Fitness', icon: Dumbbell, color: 'from-amber-500 to-red-600', textCol: 'text-amber-400', stat: 'Strength' },
      { id: 'Reading', name: 'Reading', icon: BookOpen, color: 'from-blue-500 to-indigo-600', textCol: 'text-blue-400', stat: 'Knowledge' },
      { id: 'Water', name: 'Water', icon: Droplets, color: 'from-cyan-400 to-blue-600', textCol: 'text-cyan-400', stat: 'Discipline' },
      { id: 'Meditation', name: 'Meditation', icon: Moon, color: 'from-purple-500 to-pink-600', textCol: 'text-purple-400', stat: 'Focus' },
      { id: 'Coding', name: 'Coding', icon: Code, color: 'from-emerald-400 to-teal-600', textCol: 'text-emerald-400', stat: 'Focus' },
      { id: 'Language', name: 'Language', icon: Globe, color: 'from-yellow-400 to-orange-600', textCol: 'text-yellow-400', stat: 'Knowledge' }
    ];

    const STREAK_MILESTONES = [3, 7, 15, 21, 30, 40];

    const REWARDS_MASTER = [
      { id: 'wooden_sword', name: 'Wooden Sword', rarity: 'Common', type: 'weapon', streakReq: 3, category: 'Fitness', stats: { strength: 5 }, desc: 'A basic training sword carved from oak.', icon: '⚔️' },
      { id: 'traveler_boots', name: 'Traveler Boots', rarity: 'Common', type: 'armor', streakReq: 3, category: 'Language', stats: { focus: 4 }, desc: 'Comfortable footwear for long journeys.', icon: '🥾' },
      { id: 'apprentice_scroll', name: 'Apprentice Scroll', rarity: 'Common', type: 'artifact', streakReq: 3, category: 'Reading', stats: { knowledge: 5 }, desc: 'Contains foundational magical wisdom.', icon: '📜' },
      { id: 'zen_pebble', name: 'Zen Pebble', rarity: 'Common', type: 'artifact', streakReq: 3, category: 'Meditation', stats: { discipline: 4 }, desc: 'Smooth river stone that grounds your mind.', icon: '🪨' },
      { id: 'iron_armor', name: 'Iron Armor', rarity: 'Rare', type: 'armor', streakReq: 7, category: 'Fitness', stats: { strength: 12, discipline: 5 }, desc: 'Forged in dragonfire to withstand harsh battles.', icon: '🛡️' },
      { id: 'hunter_bow', name: 'Hunter Bow', rarity: 'Rare', type: 'weapon', streakReq: 7, category: 'Language', stats: { focus: 10, knowledge: 6 }, desc: 'Finely strung bow crafted from ancient yew.', icon: '🏹' },
      { id: 'knowledge_tome', name: 'Knowledge Tome', rarity: 'Rare', type: 'artifact', streakReq: 7, category: 'Reading', stats: { knowledge: 15 }, desc: 'Bound in dark leather with glowing golden runes.', icon: '📖' },
      { id: 'trident_spear', name: 'Trident Spear', rarity: 'Rare', type: 'weapon', streakReq: 7, category: 'Water', stats: { strength: 8, discipline: 8 }, desc: 'Imbued with ocean tides and crisp waves.', icon: '🔱' },
      { id: 'shadow_blade', name: 'Shadow Blade', rarity: 'Epic', type: 'weapon', streakReq: 15, category: 'Fitness', stats: { strength: 25, focus: 10 }, desc: 'Forged from dark darksteel that slices through shadows.', icon: '🗡️' },
      { id: 'arcane_robe', name: 'Arcane Robe', rarity: 'Epic', type: 'armor', streakReq: 15, category: 'Reading', stats: { knowledge: 22, focus: 12 }, desc: 'Woven with enchanted silk that hums with arcane energy.', icon: '🥋' },
      { id: 'crystal_shield', name: 'Crystal Shield', rarity: 'Epic', type: 'armor', streakReq: 15, category: 'Water', stats: { discipline: 20, strength: 12 }, desc: 'Reflects incoming distractions like pristine ice.', icon: '🛡️' },
      { id: 'quantum_blade', name: 'Quantum Blade', rarity: 'Epic', type: 'weapon', streakReq: 15, category: 'Coding', stats: { focus: 28 }, desc: 'Cuts through syntax bugs and logic anomalies.', icon: '⚡' },
      { id: 'wolf_companion', name: 'Wolf Companion', rarity: 'Epic', type: 'pet', streakReq: 21, category: 'Fitness', stats: { strength: 18, discipline: 15 }, desc: 'A loyal silver wolf that runs beside you.', icon: '🐺' },
      { id: 'phoenix_hatchling', name: 'Phoenix Hatchling', rarity: 'Epic', type: 'pet', streakReq: 21, category: 'Reading', stats: { knowledge: 20, focus: 15 }, desc: 'Reborn from ashes, inspiring eternal learning.', icon: '🦅' },
      { id: 'ocean_dragon', name: 'Ocean Dragon', rarity: 'Epic', type: 'pet', streakReq: 21, category: 'Water', stats: { discipline: 25 }, desc: 'Serene aquatic dragon that guides water habits.', icon: '🐲' },
      { id: 'lotus_fox', name: 'Lotus Spirit Fox', rarity: 'Epic', type: 'pet', streakReq: 21, category: 'Meditation', stats: { focus: 25, discipline: 10 }, desc: 'A glowing spirit fox that grants inner calmness.', icon: '🦊' },
      { id: 'excalibur', name: 'Excalibur', rarity: 'Legendary', type: 'weapon', streakReq: 30, category: 'Fitness', stats: { strength: 45, discipline: 20 }, desc: 'The legendary blade of kings, shining with pure light.', icon: '🗡️✨' },
      { id: 'frost_reaper', name: 'Frost Reaper', rarity: 'Legendary', type: 'weapon', streakReq: 30, category: 'Water', stats: { strength: 35, discipline: 25 }, desc: 'Freezes bad habits and solidifies flawless streaks.', icon: '🌾❄️' },
      { id: 'staff_eternity', name: 'Staff of Eternity', rarity: 'Legendary', type: 'weapon', streakReq: 30, category: 'Reading', stats: { knowledge: 50 }, desc: 'Channels cosmic knowledge into unstoppable focus.', icon: '🪄🌟' },
      { id: 'robo_owl', name: 'Robo Owl Pet', rarity: 'Legendary', type: 'pet', streakReq: 30, category: 'Coding', stats: { focus: 35, knowledge: 20 }, desc: 'Autonomous companion optimizing your cognitive workflows.', icon: '🤖🦉' },
      { id: 'celestial_dragon', name: 'Celestial Dragon', rarity: 'Mythic', type: 'pet', streakReq: 40, category: 'General', stats: { strength: 30, focus: 30, knowledge: 30, discipline: 30 }, desc: 'A mythical cosmic beast embodying supreme habit mastery.', icon: '🐲✨' },
      { id: 'titan_armor', name: 'Titan Armor Set', rarity: 'Mythic', type: 'armor', streakReq: 40, category: 'Fitness', stats: { strength: 60, discipline: 40 }, desc: 'Forged from star core metal. Unshakeable and divine.', icon: '🛡️👑' },
      { id: 'castle_skin', name: 'Legendary Castle Skin', rarity: 'Mythic', type: 'artifact', streakReq: 40, category: 'General', stats: { discipline: 50 }, desc: 'Transforms your domain into a sprawling floating citadel.', icon: '🏰' }
    ];

    const GET_RANK_TITLE = (streak) => {
      if (streak >= 40) return { title: 'Legend', color: 'from-rose-500 via-amber-400 to-yellow-300' };
      if (streak >= 30) return { title: 'Hero', color: 'from-amber-400 to-yellow-500' };
      if (streak >= 21) return { title: 'Champion', color: 'from-purple-400 to-indigo-500' };
      if (streak >= 15) return { title: 'Knight', color: 'from-blue-400 to-cyan-500' };
      if (streak >= 7) return { title: 'Warrior', color: 'from-emerald-400 to-teal-500' };
      if (streak >= 3) return { title: 'Adventurer', color: 'from-slate-300 to-slate-400' };
      return { title: 'Recruit', color: 'from-slate-500 to-slate-600' };
    };

    const RARITY_COLORS = {
      Common: { text: 'text-slate-300', border: 'border-slate-600', bg: 'bg-slate-800/80' },
      Rare: { text: 'text-blue-400', border: 'border-blue-500', bg: 'bg-blue-950/80' },
      Epic: { text: 'text-purple-400', border: 'border-purple-500', bg: 'bg-purple-950/80' },
      Legendary: { text: 'text-amber-400', border: 'border-amber-500', bg: 'bg-amber-950/80' },
      Mythic: { text: 'text-rose-400 border-rose-500', border: 'border-rose-500', bg: 'bg-rose-950/80' }
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [soundEnabled, setSoundEnabled] = useState(true);

      // FRESH BLANK USER STATE
      const [user, setUser] = useState({
        level: 1,
        xp: 0,
        xpMax: 100,
        gold: 0,
        totalStreak: 0,
        unlockedItemIds: [],
        equipped: {
          weapon: null,
          armor: null,
          helmet: null,
          pet: null,
          artifact: null
        }
      });

      // EMPTY HABITS ARRAY
      const [habits, setHabits] = useState([]);

      const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
      const [editingHabit, setEditingHabit] = useState(null);
      const [lootModalItem, setLootModalItem] = useState(null);
      const [levelUpModal, setLevelUpModal] = useState(null);
      const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);
      const [selectedInventoryItem, setSelectedInventoryItem] = useState(null);

      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const characterStats = useMemo(() => {
        let base = { discipline: 10, focus: 10, strength: 10, knowledge: 10 };
        Object.values(user.equipped).forEach(itemId => {
          if (!itemId) return;
          const item = REWARDS_MASTER.find(r => r.id === itemId);
          if (item && item.stats) {
            Object.entries(item.stats).forEach(([statKey, val]) => {
              if (base[statKey] !== undefined) {
                base[statKey] += val;
              }
            });
          }
        });
        return base;
      }, [user.equipped]);

      const handleCompleteQuest = (habitId) => {
        const todayStr = new Date().toISOString().split('T')[0];
        let xpGained = 0;
        let goldGained = 0;
        let newStreak = 0;

        setHabits(prevHabits =>
          prevHabits.map(h => {
            if (h.id === habitId) {
              if (h.completedToday) return h;
              xpGained = h.xpReward;
              goldGained = h.goldReward;
              newStreak = h.currentStreak + 1;

              return {
                ...h,
                completedToday: true,
                currentStreak: newStreak,
                history: [...new Set([...h.history, todayStr])]
              };
            }
            return h;
          })
        );

        if (xpGained === 0) return;

        playSound('complete', soundEnabled);

        let newXp = user.xp + xpGained;
        let newGold = user.gold + goldGained;
        let newLevel = user.level;
        let newXpMax = user.xpMax;
        let leveledUp = false;

        if (newXp >= user.xpMax) {
          newLevel += 1;
          newXp = newXp - user.xpMax;
          newXpMax = Math.floor(user.xpMax * 1.2);
          leveledUp = true;
        }

        let newlyUnlockedItem = null;
        const availableRewards = REWARDS_MASTER.filter(r => r.streakReq <= newStreak && !user.unlockedItemIds.includes(r.id));
        if (availableRewards.length > 0) {
          newlyUnlockedItem = availableRewards[0];
        }

        setUser(prev => ({
          ...prev,
          level: newLevel,
          xp: newXp,
          xpMax: newXpMax,
          gold: newGold,
          totalStreak: Math.max(prev.totalStreak, newStreak),
          unlockedItemIds: newlyUnlockedItem
            ? [...prev.unlockedItemIds, newlyUnlockedItem.id]
            : prev.unlockedItemIds
        }));

        if (leveledUp) {
          setTimeout(() => {
            playSound('levelup', soundEnabled);
            setLevelUpModal(newLevel);
          }, 400);
        }

        if (newlyUnlockedItem) {
          setTimeout(() => {
            playSound('loot', soundEnabled);
            setLootModalItem(newlyUnlockedItem);
          }, leveledUp ? 1200 : 500);
        }
      };

      const handleSaveHabit = (newHabitData) => {
        if (editingHabit) {
          setHabits(prev => prev.map(h => h.id === editingHabit.id ? { ...h, ...newHabitData } : h));
          setEditingHabit(null);
        } else {
          const habit = {
            id: 'h_' + Date.now(),
            ...newHabitData,
            currentStreak: 0,
            completedToday: false,
            history: []
          };
          setHabits(prev => [...prev, habit]);
        }
        setIsCreateModalOpen(false);
      };

      const handleDeleteHabit = (id) => {
        if (window.confirm("Are you sure you want to delete this habit quest?")) {
          setHabits(prev => prev.filter(h => h.id !== id));
          playSound('click', soundEnabled);
        }
      };

      const handleEquipItem = (item) => {
        playSound('click', soundEnabled);
        setUser(prev => ({
          ...prev,
          equipped: {
            ...prev.equipped,
            [item.type]: prev.equipped[item.type] === item.id ? null : item.id
          }
        }));
      };

      const handleResetData = () => {
        if (window.confirm("Clear all data and reset to fresh state?")) {
          localStorage.removeItem('questforge_user');
          localStorage.removeItem('questforge_habits');
          window.location.reload();
        }
      };

      const formattedDate = currentTime.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });
      const formattedTime = currentTime.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      const currentRank = GET_RANK_TITLE(user.totalStreak);

      return (
        <div className="min-h-screen bg-[#0E1117] text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-900 pb-20 md:pb-6">
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-purple-900/20 rounded-full blur-3xl"></div>
            <div className="absolute top-1/3 -right-40 w-96 h-96 bg-amber-600/15 rounded-full blur-3xl"></div>
            <div className="absolute -bottom-40 left-1/3 w-96 h-96 bg-emerald-900/15 rounded-full blur-3xl"></div>
          </div>

          <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">

            {/* TOP HEADER BAR */}
            <header className="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-amber-500/20 shadow-lg mb-6">
              <div className="flex items-center gap-3">
                <div className="relative flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-purple-600 text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20">
                  ⚔️
                </div>
                <div>
                  <h1 className="text-2xl font-bold bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 bg-clip-text text-transparent font-serif tracking-wide">
                    QuestForge
                  </h1>
                  <p className="text-xs text-slate-400 flex items-center gap-2">
                    <span>Habit RPG</span>
                    <span className="inline-block w-1 h-1 rounded-full bg-amber-500"></span>
                    <span className="text-amber-400/90 font-medium">{formattedDate} • {formattedTime}</span>
                  </p>
                </div>
              </div>

              {/* QUICK STATS */}
              <div className="flex items-center gap-3 sm:gap-4 overflow-x-auto py-1">
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/60">
                  <span className="text-xs text-slate-400">Level</span>
                  <span className="font-bold text-amber-400">{user.level}</span>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/60">
                  <Zap className="w-4 h-4 text-amber-400" />
                  <div className="flex flex-col">
                    <span className="text-[10px] text-slate-400 leading-none">XP</span>
                    <span className="text-xs font-semibold text-slate-200">{user.xp}/{user.xpMax}</span>
                  </div>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-amber-500/30">
                  <span className="text-amber-400 font-bold">🪙</span>
                  <span className="font-bold text-amber-300">{user.gold}</span>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-amber-500/40">
                  <Flame className="w-4 h-4 text-amber-400 animate-pulse" />
                  <span className="font-extrabold text-amber-400">{user.totalStreak} Days</span>
                </div>

                <button
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
                  title="Toggle SFX Audio"
                >
                  {soundEnabled ? <Volume2 className="w-4 h-4 text-amber-400" /> : <VolumeX className="w-4 h-4 text-slate-500" />}
                </button>

                <button
                  onClick={handleResetData}
                  className="p-2 rounded-xl bg-slate-800 hover:bg-rose-950/50 text-slate-400 hover:text-rose-400 border border-slate-700 transition"
                  title="Reset All App Data"
                >
                  <RotateCcw className="w-4 h-4" />
                </button>
              </div>
            </header>

            {/* NAVIGATION TABS BAR */}
            <nav className="flex items-center gap-1 overflow-x-auto p-1.5 rounded-2xl bg-slate-900/90 border border-slate-800 backdrop-blur-md mb-6 shadow-inner scrollbar-none">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: Compass },
                { id: 'quests', label: 'Habit Quests', icon: Sword },
                { id: 'calendar', label: 'Calendar View', icon: Calendar },
                { id: 'character', label: 'Character', icon: User },
                { id: 'inventory', label: 'Inventory', icon: Package },
                { id: 'progress', label: 'Progress Center', icon: Trophy },
                { id: 'reminders', label: 'Reminders', icon: Bell },
                { id: 'analytics', label: 'Analytics', icon: BarChart2 }
              ].map(tab => {
                const Icon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => {
                      playSound('click', soundEnabled);
                      setActiveTab(tab.id);
                    }}
