<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestForge - Habit RPG</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#0E1117]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- LUCIDE ICON HELPER FOR CDN COMPATIBILITY ---
    const IconWrapper = ({ name, className = "w-4 h-4", ...props }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          if (window.lucide) {
            window.lucide.createIcons({
              attrs: { class: className },
              nameAttr: 'data-lucide'
            });
          }
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" {...props} />;
    };

    const createIcon = (name) => (props) => <IconWrapper name={name} {...props} />;

    const Trophy = createIcon('trophy');
    const Shield = createIcon('shield');
    const Sword = createIcon('sword');
    const Flame = createIcon('flame');
    const Sparkles = createIcon('sparkles');
    const BookOpen = createIcon('book-open');
    const Droplets = createIcon('droplets');
    const Dumbbell = createIcon('dumbbell');
    const Code = createIcon('code');
    const Globe = createIcon('globe');
    const Moon = createIcon('moon');
    const Calendar = createIcon('calendar');
    const BarChart2 = createIcon('bar-chart-2');
    const User = createIcon('user');
    const Package = createIcon('package');
    const Bell = createIcon('bell');
    const Compass = createIcon('compass');
    const Plus = createIcon('plus');
    const Check = createIcon('check');
    const X = createIcon('x');
    const Edit3 = createIcon('edit-3');
    const Trash2 = createIcon('trash-2');
    const Zap = createIcon('zap');
    const Lock = createIcon('lock');
    const Volume2 = createIcon('volume-2');
    const VolumeX = createIcon('volume-x');
    const AlertTriangle = createIcon('alert-triangle');
    const CheckCircle2 = createIcon('check-circle-2');
    const Clock = createIcon('clock');
    const PieChart = createIcon('pie-chart');
    const RotateCcw = createIcon('rotate-ccw');
    const Camera = createIcon('camera');

    // --- SOUND SYNTHESIZER ---
    const playSound = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'complete') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.08);
            osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
          });
        } else if (type === 'levelup') {
          const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.09);
            osc.stop(ctx.currentTime + idx * 0.09 + 0.35);
          });
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch (e) {}
    };

    const HABIT_CATEGORIES = [
      { id: 'Fitness', name: 'Fitness', icon: Dumbbell, color: 'from-amber-500 to-red-600' },
      { id: 'Reading', name: 'Reading', icon: BookOpen, color: 'from-blue-500 to-indigo-600' },
      { id: 'Water', name: 'Water', icon: Droplets, color: 'from-cyan-400 to-blue-600' },
      { id: 'Meditation', name: 'Meditation', icon: Moon, color: 'from-purple-500 to-pink-600' },
      { id: 'Coding', name: 'Coding', icon: Code, color: 'from-emerald-400 to-teal-600' },
      { id: 'Language', name: 'Language', icon: Globe, color: 'from-yellow-400 to-orange-600' }
    ];

    const STREAK_MILESTONES = [3, 7, 15, 21, 30, 40];

    const REWARDS_MASTER = [
      { id: 'wooden_sword', name: 'Wooden Sword', rarity: 'Common', type: 'weapon', streakReq: 3, category: 'Fitness', stats: { strength: 5 }, desc: 'A basic training sword carved from oak.', icon: '⚔️' },
      { id: 'iron_armor', name: 'Iron Armor', rarity: 'Rare', type: 'armor', streakReq: 7, category: 'Fitness', stats: { strength: 12, discipline: 5 }, desc: 'Forged in dragonfire to withstand harsh battles.', icon: '🛡️' },
      { id: 'shadow_blade', name: 'Shadow Blade', rarity: 'Epic', type: 'weapon', streakReq: 15, category: 'Fitness', stats: { strength: 25, focus: 10 }, desc: 'Forged from dark steel.', icon: '🗡️' },
      { id: 'wolf_companion', name: 'Wolf Companion', rarity: 'Epic', type: 'pet', streakReq: 21, category: 'Fitness', stats: { strength: 18, discipline: 15 }, desc: 'A loyal silver wolf that runs beside you.', icon: '🐺' },
      { id: 'excalibur', name: 'Excalibur', rarity: 'Legendary', type: 'weapon', streakReq: 30, category: 'Fitness', stats: { strength: 45, discipline: 20 }, desc: 'The legendary blade of kings.', icon: '🗡️✨' }
    ];

    const GET_RANK_TITLE = (streak) => {
      if (streak >= 40) return { title: 'Legend', color: 'from-rose-500 via-amber-400 to-yellow-300' };
      if (streak >= 30) return { title: 'Hero', color: 'from-amber-400 to-yellow-500' };
      if (streak >= 21) return { title: 'Champion', color: 'from-purple-400 to-indigo-500' };
      if (streak >= 15) return { title: 'Knight', color: 'from-blue-400 to-cyan-500' };
      if (streak >= 7) return { title: 'Warrior', color: 'from-emerald-400 to-teal-500' };
      if (streak >= 3) return { title: 'Adventurer', color: 'from-slate-300 to-slate-400' };
      return { title: 'Recruit', color: 'from-slate-500 to-slate-600' };
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [soundEnabled, setSoundEnabled] = useState(true);

      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('questforge_user');
        return saved ? JSON.parse(saved) : {
          name: 'Sir Questalot',
          avatar: null,
          level: 1,
          xp: 0,
          xpMax: 100,
          gold: 0,
          totalStreak: 0,
          unlockedItemIds: [],
          equipped: { weapon: null, armor: null, helmet: null, pet: null, artifact: null }
        };
      });

      const [habits, setHabits] = useState(() => {
        const saved = localStorage.getItem('questforge_habits');
        return saved ? JSON.parse(saved) : [];
      });

      const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
      const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
      const [editingHabit, setEditingHabit] = useState(null);
      const [levelUpModal, setLevelUpModal] = useState(null);
      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        try {
          localStorage.setItem('questforge_user', JSON.stringify(user));
        } catch (e) {
          console.error("Storage write error:", e);
        }
      }, [user]);

      useEffect(() => {
        try {
          localStorage.setItem('questforge_habits', JSON.stringify(habits));
        } catch (e) {
          console.error("Storage write error:", e);
        }
      }, [habits]);

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const characterStats = useMemo(() => {
        let base = { discipline: 10, focus: 10, strength: 10, knowledge: 10 };
        Object.values(user.equipped).forEach(itemId => {
          if (!itemId) return;
          const item = REWARDS_MASTER.find(r => r.id === itemId);
          if (item && item.stats) {
            Object.entries(item.stats).forEach(([statKey, val]) => {
              if (base[statKey] !== undefined) base[statKey] += val;
            });
          }
        });
        return base;
      }, [user.equipped]);

      // --- ROBUST XP & LEVEL ACCUMULATION HANDLER ---
      const handleCompleteQuest = (habitId) => {
        const targetHabit = habits.find(h => h.id === habitId);
        if (!targetHabit || targetHabit.completedToday) return;

        const todayStr = new Date().toISOString().split('T')[0];
        const xpToAdd = Number(targetHabit.xpReward) || 25;
        const goldToAdd = Number(targetHabit.goldReward) || 10;
        const nextStreak = (targetHabit.currentStreak || 0) + 1;

        // 1. Update Habits State
        setHabits(prevHabits =>
          prevHabits.map(h => {
            if (h.id === habitId) {
              return {
                ...h,
                completedToday: true,
                currentStreak: nextStreak,
                history: [...new Set([...(h.history || []), todayStr])]
              };
            }
            return h;
          })
        );

        playSound('complete', soundEnabled);

        // 2. Compute XP Level-Ups Accurately
        setUser(prevUser => {
          let currentXp = Number(prevUser.xp || 0) + xpToAdd;
          let currentLevel = Number(prevUser.level || 1);
          let currentXpMax = Number(prevUser.xpMax || 100);
          let didLevelUp = false;

          while (currentXp >= currentXpMax) {
            currentXp -= currentXpMax;
            currentLevel += 1;
            currentXpMax = Math.floor(currentXpMax * 1.25);
            didLevelUp = true;
          }

          if (didLevelUp) {
            setTimeout(() => {
              playSound('levelup', soundEnabled);
              setLevelUpModal(currentLevel);
            }, 300);
          }

          return {
            ...prevUser,
            level: currentLevel,
            xp: currentXp,
            xpMax: currentXpMax,
            gold: Number(prevUser.gold || 0) + goldToAdd,
            totalStreak: Math.max(Number(prevUser.totalStreak || 0), nextStreak)
          };
        });
      };

      const handleSaveHabit = (newHabitData) => {
        if (editingHabit) {
          setHabits(prev => prev.map(h => h.id === editingHabit.id ? { ...h, ...newHabitData } : h));
          setEditingHabit(null);
        } else {
          setHabits(prev => [
            ...prev,
            {
              id: 'h_' + Date.now(),
              ...newHabitData,
              currentStreak: 0,
              completedToday: false,
              history: []
            }
          ]);
        }
        setIsCreateModalOpen(false);
      };

      const handleDeleteHabit = (id) => {
        if (window.confirm("Are you sure you want to abandon and delete this habit quest?")) {
          setHabits(prev => prev.filter(h => h.id !== id));
          playSound('click', soundEnabled);
        }
      };

      const handleSaveProfile = (profileData) => {
        setUser(prev => ({ ...prev, name: profileData.name, avatar: profileData.avatar }));
        playSound('click', soundEnabled);
      };

      const handleResetData = () => {
        if (window.confirm("Reset QuestForge data to initial state?")) {
          localStorage.removeItem('questforge_user');
          localStorage.removeItem('questforge_habits');
          window.location.reload();
        }
      };

      const formattedDate = currentTime.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      const formattedTime = currentTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const currentRank = GET_RANK_TITLE(user.totalStreak);

      return (
        <div className="min-h-screen bg-[#0E1117] text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-900 pb-20 md:pb-6">
          <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">

            {/* TOP HEADER BAR */}
            <header className="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-amber-500/20 shadow-lg mb-6">
              <div className="flex items-center gap-3">
                <div className="relative flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-purple-600 text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20">
                  ⚔️
                </div>
                <div>
                  <h1 className="text-2xl font-bold bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 bg-clip-text text-transparent font-serif tracking-wide">
                    QuestForge
                  </h1>
                  <p className="text-xs text-slate-400 flex items-center gap-2">
                    <span>Habit RPG</span>
                    <span className="inline-block w-1 h-1 rounded-full bg-amber-500"></span>
                    <span className="text-amber-400/90 font-medium">{formattedDate} • {formattedTime}</span>
                  </p>
                </div>
              </div>

              {/* QUICK STATS HEADER BADGES */}
              <div className="flex items-center gap-3 sm:gap-4 overflow-x-auto py-1">
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/60">
                  <span className="text-xs text-slate-400">Level</span>
                  <span className="font-bold text-amber-400">{user.level}</span>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/60">
                  <Zap className="w-4 h-4 text-amber-400" />
                  <div className="flex flex-col">
                    <span className="text-[10px] text-slate-400 leading-none">XP</span>
                    <span className="text-xs font-semibold text-slate-200">{user.xp}/{user.xpMax}</span>
                  </div>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-amber-500/30">
                  <span className="text-amber-400 font-bold">🪙</span>
                  <span className="font-bold text-amber-300">{user.gold}</span>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-amber-500/40">
                  <Flame className="w-4 h-4 text-amber-400 animate-pulse" />
                  <span className="font-extrabold text-amber-400">{user.totalStreak} Days</span>
                </div>

                <button
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
                  title="Toggle SFX Audio"
                >
                  {soundEnabled ? <Volume2 className="w-4 h-4 text-amber-400" /> : <VolumeX className="w-4 h-4 text-slate-500" />}
                </button>

                <button
                  onClick={handleResetData}
                  className="p-2 rounded-xl bg-slate-800 hover:bg-rose-950/50 text-slate-400 hover:text-rose-400 border border-slate-700 transition"
                  title="Reset Demo Data"
                >
                  <RotateCcw className="w-4 h-4" />
                </button>
              </div>
            </header>

            {/* TAB NAVIGATION */}
            <nav className="flex items-center gap-1 overflow-x-auto p-1.5 rounded-2xl bg-slate-900/90 border border-slate-800 backdrop-blur-md mb-6 shadow-inner scrollbar-none">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: Compass },
                { id: 'quests', label: 'Habit Quests', icon: Sword },
                { id: 'character', label: 'Character', icon: User }
              ].map(tab => {
                const Icon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => { playSound('click', soundEnabled); setActiveTab(tab.id); }}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-xs sm:text-sm whitespace-nowrap transition-all duration-200 ${
                      isActive
                        ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold shadow-md'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                    }`}
                  >
                    <Icon className={`w-4 h-4 ${isActive ? 'text-slate-950' : 'text-slate-400'}`} />
                    <span>{tab.label}</span>
                  </button>
                );
              })}
            </nav>

            {/* MAIN CONTENT */}
            <main className="space-y-6">
              {activeTab === 'dashboard' && (
                <DashboardView
                  user={user}
                  habits={habits}
                  currentRank={currentRank}
                  characterStats={characterStats}
                  onComplete={handleCompleteQuest}
                  onDelete={handleDeleteHabit}
                  onOpenCreate={() => setIsCreateModalOpen(true)}
                  onOpenEditProfile={() => setIsEditProfileOpen(true)}
                />
              )}

              {activeTab === 'quests' && (
                <HabitQuestsView
                  habits={habits}
                  onComplete={handleCompleteQuest}
                  onOpenCreate={() => { setEditingHabit(null); setIsCreateModalOpen(true); }}
                  onEdit={(habit) => { setEditingHabit(habit); setIsCreateModalOpen(true); }}
                  onDelete={handleDeleteHabit}
                />
              )}

              {activeTab === 'character' && (
                <CharacterView
                  user={user}
                  characterStats={characterStats}
                  currentRank={currentRank}
                  onOpenEditProfile={() => setIsEditProfileOpen(true)}
                />
              )}
            </main>
          </div>

          {/* MODALS */}
          {isCreateModalOpen && (
            <CreateHabitModal
              habitToEdit={editingHabit}
              onSave={handleSaveHabit}
              onClose={() => setIsCreateModalOpen(false)}
            />
          )}

          {isEditProfileOpen && (
            <EditProfileModal
              user={user}
              onSave={handleSaveProfile}
              onClose={() => setIsEditProfileOpen(false)}
            />
          )}

          {levelUpModal && (
            <LevelUpModal
              level={levelUpModal}
              onClose={() => setLevelUpModal(null)}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // DASHBOARD VIEW
    // ==========================================
    function DashboardView({ user, habits, currentRank, characterStats, onComplete, onDelete, onOpenCreate, onOpenEditProfile }) {
      const activeQuests = habits.filter(h => !h.completedToday);
      const completedTodayList = habits.filter(h => h.completedToday);
      const completionRate = habits.length ? Math.round((completedTodayList.length / habits.length) * 100) : 0;

      return (
        <div className="space-y-6">
          {/* HERO CARD */}
          <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900/90 to-purple-950/40 border border-amber-500/30 p-6 shadow-2xl">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
              <div className="flex items-center gap-5">
                <div className="relative group">
                  <div className="w-20 h-20 rounded-2xl bg-slate-800 border-2 border-amber-400 shadow-lg shadow-amber-500/20 overflow-hidden flex items-center justify-center text-4xl">
                    {user.avatar ? (
                      <img src={user.avatar} alt="Knight Avatar" className="w-full h-full object-cover" />
                    ) : (
                      <span>🛡️</span>
                    )}
                  </div>
                  
                  <button
                    onClick={onOpenEditProfile}
                    className="absolute -top-2 -right-2 p-1.5 rounded-full bg-amber-400 text-slate-950 shadow-md hover:scale-110 transition"
                    title="Edit Knight Name & Photo"
                  >
                    <Edit3 className="w-3.5 h-3.5" />
                  </button>

                  <div className="absolute -bottom-2 -right-2 px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 font-black text-xs border border-slate-900 shadow">
                    Lvl {user.level}
                  </div>
                </div>

                <div>
                  <div className="flex items-center gap-2">
                    <span className={`text-xs uppercase tracking-wider font-extrabold bg-gradient-to-r ${currentRank.color} bg-clip-text text-transparent`}>
                      {currentRank.title} Rank
                    </span>
                    <span className="text-xs px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 text-amber-300 font-medium">
                      {user.totalStreak}d Streak 🔥
                    </span>
                  </div>

                  <h2 className="text-2xl font-bold font-serif text-slate-100 flex items-center gap-2">
                    {user.name || 'Sir Questalot'}
                    <button onClick={onOpenEditProfile} className="text-slate-500 hover:text-amber-400 transition text-xs">
                      <Edit3 className="w-4 h-4" />
                    </button>
                  </h2>

                  <p className="text-xs text-slate-400 flex items-center gap-2 mt-1">
                    <span>Gold: <strong className="text-amber-400">{user.gold} 🪙</strong></span>
                  </p>
                </div>
              </div>

              {/* XP PROGRESS BAR */}
              <div className="space-y-2 lg:col-span-2">
                <div className="flex justify-between items-center text-xs font-medium">
                  <span className="text-slate-300 flex items-center gap-1.5">
                    <Zap className="w-4 h-4 text-amber-400" /> Experience Progress
                  </span>
                  <span className="text-amber-400 font-bold">{user.xp} / {user.xpMax} XP</span>
                </div>

                <div className="relative w-full h-4 bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-800">
                  <div
                    className="h-full rounded-full bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-300 transition-all duration-500"
                    style={{ width: `${Math.min(100, Math.max(0, (user.xp / user.xpMax) * 100))}%` }}
                  ></div>
                </div>

                <div className="grid grid-cols-4 gap-2 pt-2">
                  <div className="p-2 rounded-xl bg-slate-800/60 border border-slate-700/50 text-center">
                    <div className="text-[10px] text-slate-400">Strength</div>
                    <div className="text-xs font-bold text-amber-400">{characterStats.strength}</div>
                  </div>
                  <div className="p-2 rounded-xl bg-slate-800/60 border border-slate-700/50 text-center">
                    <div className="text-[10px] text-slate-400">Knowledge</div>
                    <div className="text-xs font-bold text-blue-400">{characterStats.knowledge}</div>
                  </div>
                  <div className="p-2 rounded-xl bg-slate-800/60 border border-slate-700/50 text-center">
                    <div className="text-[10px] text-slate-400">Focus</div>
                    <div className="text-xs font-bold text-purple-400">{characterStats.focus}</div>
                  </div>
                  <div className="p-2 rounded-xl bg-slate-800/60 border border-slate-700/50 text-center">
                    <div className="text-[10px] text-slate-400">Discipline</div>

    // ==========================================
    // EDIT PROFILE / KNIGHT MODAL
    // ==========================================
    function EditProfileModal({ user, onSave, onClose }) {
      const [name, setName] = useState(user.name || 'Sir Questalot');
      const [avatar, setAvatar] = useState(user.avatar || null);
      const [isUploading, setIsUploading] = useState(false);

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsUploading(true);

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 300;
            const MAX_HEIGHT = 300;

            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
            setAvatar(compressedBase64);
            setIsUploading(false);
          };
        };
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ name, avatar });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="relative w-full max-w-md rounded-3xl bg-slate-900 border border-amber-500/40 p-6 shadow-2xl space-y-5">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-100">
              <X className="w-5 h-5" />
            </button>

            <h3 className="text-lg font-bold font-serif text-amber-400 flex items-center gap-2">
              <User className="w-5 h-5" /> Customize Knight
            </h3>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block text-slate-300 font-bold mb-1">Knight Name</label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="e.g. Sir Lancelot"
                  className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-400 text-sm"
                  required
                />
              </div>

              <div>
                <label className="block text-slate-300 font-bold mb-2">Avatar Photo</label>
                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-2xl bg-slate-950 border border-slate-700 flex items-center justify-center overflow-hidden text-2xl flex-shrink-0">
                    {avatar ? <img src={avatar} className="w-full h-full object-cover" /> : <span>🛡️</span>}
                  </div>
                  
                  <div className="space-y-1">
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleFileChange}
                      className="text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer"
                    />
                    {isUploading && <p className="text-[10px] text-amber-400">Processing photo...</p>}
                    {avatar && !isUploading && (
                      <button
                        type="button"
                        onClick={() => setAvatar(null)}
                        className="block text-[11px] text-rose-400 hover:underline pt-1"
                      >
                        Remove custom photo
                      </button>
                    )}
                  </div>
                </div>
              </div>

              <button
                type="submit"
                disabled={isUploading}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-extrabold text-sm shadow-lg hover:from-amber-400 transition"
              >
                Save Knight Profile
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE/EDIT HABIT MODAL
    // ==========================================
    function CreateHabitModal({ habitToEdit, onSave, onClose }) {
      const [name, setName] = useState(habitToEdit?.name || '');

        if (!name.trim()) return;

          difficulty,
          reminderTime,
          xpReward: Number(xpReward) || 25,
          goldReward: Number(goldReward) || 10

      return (

                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="e.g. Read 10 Pages 📚"
                  className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-400 text-sm"
                  required
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 font-bold mb-1">Category</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}

                    {HABIT_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-slate-300 font-bold mb-1">Reminder Time</label>
                  <input
                    type="time"
                    value={reminderTime}
                    onChange={(e) => setReminderTime(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 font-bold mb-1">XP Gain</label>
                  <input
                    type="number"
                    value={xpReward}
                    onChange={(e) => setXpReward(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5"
                  />
                </div>
                <div>
                  <label className="block text-slate-300 font-bold mb-1">Gold Gain</label>
                  <input
                    type="number"
                    value={goldReward}
                    onChange={(e) => setGoldReward(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5"
                  />
                </div>
              </div>

              <button
                type="submit"
                className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-extrabold text-sm shadow-lg hover:from-amber-400 transition"
              >
                {habitToEdit ? 'Save Changes' : 'Forge Quest'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
